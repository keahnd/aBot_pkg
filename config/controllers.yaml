controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive:
      type: diff_drive_controller/DiffDriveController

joint_broad:
  ros__parameters:
    use_sim_time: true

diff_drive:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.1827
    wheel_radius: 0.033
    base_frame_id: base_link
    publish_rate: 30.0
    use_sim_time: true